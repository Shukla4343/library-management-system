version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: library-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: library_management
    volumes:
      - mongodb_data:/data/db
    networks:
      - library-network

  backend:
    build: ./backend
    container_name: library-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/library_management?authSource=admin
      JWT_SECRET: your_super_secure_jwt_secret_key_change_in_production
      JWT_REFRESH_SECRET: your_super_secure_refresh_secret_key_change_in_production
    depends_on:
      - mongodb
    networks:
      - library-network

  frontend:
    build: ./frontend
    container_name: library-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - library-network

volumes:
  mongodb_data:

networks:
  library-network:
    driver: bridge